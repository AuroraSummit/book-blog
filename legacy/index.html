<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="纸页之间 · 读书笔记与观影感受的个人博客">
  <title>纸页之间 · 读书与观影手记</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">
  <!-- 阅读进度条 + 回到顶部（由 js/ui.js 控制） -->
  <div class="reading-progress" id="reading-progress" role="progressbar" aria-label="阅读进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
  <button class="back-to-top" id="back-to-top" type="button" aria-label="回到顶部">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 13V3"/>
      <path d="M3.5 7.5 8 3l4.5 4.5"/>
    </svg>
  </button>

  <div class="page">

    <!-- 页眉：如一本安静书的扉页 -->
    <header class="site-head">
      <h1 class="site-name">纸页之间</h1>
      <p class="site-sub">读书笔记 · 观影感受 · 安静记录</p>
      <div class="nav-row">
        <nav class="site-nav" aria-label="站点导航">
          <a href="index.html" class="active">文章</a>
          <a href="books.html">读书</a>
          <a href="movies.html">影评</a>
          <a href="about.html">关于</a>
        </nav>
        <form class="site-search" action="search.html" method="get" role="search">
          <input type="search" name="q" placeholder="搜文章 / 影评 / 标签" aria-label="站内搜索">
        </form>
      </div>
    </header>

    <main>
      <!-- 列表标题 + 分类筛选（纯文字切换，无动画） -->
      <div class="list-head">
        <h2 class="list-title">最近的文章</h2>
        <div class="filters" role="group" aria-label="按分类筛选文章">
          <button class="active" data-filter="all">全部</button>
          <button data-filter="reading">读书笔记</button>
          <button data-filter="movie">观影感受</button>
        </div>
      </div>

      <!-- 文章列表：由 js/list.js 渲染，按日期倒序，每页 5 篇 -->
      <section id="article-list" aria-live="polite"></section>

      <!-- 分页（超过 5 篇时由 js/list.js 渲染） -->
      <nav class="pagination" id="pagination" aria-label="分页"></nav>

      <!-- 空状态（筛选结果为空时显示） -->
      <p class="list-empty" id="list-empty">这个分类下还没有文章。</p>

      <p class="list-foot" id="page-count"></p>
    </main>

    <!-- 页脚 -->
    <footer class="site-foot">
      <p>纸页之间 · 写于二零二六年</p>
      <p>用一本安静的书，盛下读过的世界</p>
    </footer>

  </div>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/list.js"></script>
</body>
</html>
