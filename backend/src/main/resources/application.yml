server:
  port: 8080

spring:
  application:
    name: paper-pages
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/paper_pages?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    time-zone: Asia/Shanghai

# 「纸页之间」自定义配置
paper:
  jwt:
    # 生产环境务必通过环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:paper-pages-dev-secret-please-change-in-production-0123456789}
    expire-hours: 168   # token 有效期 7 天
  admin:
    # 博主账号：首次启动自动创建（密码 BCrypt 加密入库）
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}

logging:
  level:
    com.paperpages: info
